# docker-dev ClamAV daemon configuration, mounted over the stock image's /etc/clamav/clamd.conf.
#
# NOTE: this mount REPLACES the whole stock clamd.conf, it does not merge with it. Anything the
# stock file set that is not repeated below is therefore dropped - most notably "User clamav", so
# clamd here runs as root. That is root inside the container's namespace only (dev-only, not root
# on your host), and it is deliberate: it keeps /run/clamav (a root-owned named volume) writable by
# clamd without extra ownership juggling. The 0666 socket below is what lets the non-root www-data
# in the PHP containers connect to a socket created by root.
#
# Logging: we do not set LogFile (ClamAV rejects /dev/stdout with "Symbolic link loop"), and because
# this replaces the stock conf, stock's file-based LogFile is dropped too. To see clamd output
# (including scan results and signature loading), use: docker logs totara_clamav

# Unix socket, shared with the PHP 8.4/8.5 containers via the clamav-socket volume. The stock
# default is /tmp/clamd.sock, which we cannot share without mounting over the whole of /tmp.
# Those containers run clamdscan with --fdpass, which passes the open file descriptor over this
# socket, so clamd never needs to see the scanned file's path or be able to read it itself.
# Mode 0666 so that www-data in the PHP containers can connect.
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 0666

# Required, not optional: the stock image's HEALTHCHECK runs clamdcheck.sh, which pings clamd over
# TCP 3310 (not the unix socket). Remove this and the container never reports healthy. Totara itself
# cannot use TCP - antivirus_clamav's scanner::is_configured() returns false for the tcpsocket
# running method, so a TCP-configured plugin is silently never invoked - which is why the PHP
# containers use the unix socket above instead.
TCPSocket 3310
TCPAddr 0.0.0.0

# No scan-size overrides needed. The --fdpass (commandline) path the PHP containers use is bounded
# by MaxFileSize/MaxScanSize (not StreamMaxLength, which only covers INSTREAM). clamd's defaults -
# MaxFileSize 100M, MaxScanSize 400M, StreamMaxLength 100M - all already exceed
# upload_max_filesize/post_max_size (64M) in php/config/php.ini, so uploads are scanned in full.
# Do not set MaxScanSize below its 400M default: that would only partly scan large archives.
