name: Build MSSQL images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - mssql/**
      - .github/workflows/build-image.yml
      - .github/workflows/build-mssql.yml

# Publishing runs are queued rather than run side by side, so a build ahead of the release and the
# release itself can't push the same image at once. A new push to a pull request cancels its stale build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-mssql-images:
    name: Build MSSQL images
    strategy:
      fail-fast: false
      matrix:
        version: [2017, 2019, 2022]
    uses: ./.github/workflows/build-image.yml
    with:
      image: mssql${{ matrix.version }}
      context: ./mssql
      dockerfile: ${{ matrix.version }}/Dockerfile
      multiarch: false # Mssql does not support multiple architectures
    secrets: inherit
