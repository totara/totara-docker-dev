name: Trivy Image Vulnerability Scan

# Runs on its own every week, and as the last job of the build workflows once they have published
# their images. A caller passes the images it published, a standalone run scans all of them.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to scan. Defaults to the version in version.txt'
        type: string
        required: false
        default: ''
  schedule:
    - cron: '0 18 * * 0' # Run every Monday at 6am NZST / 7am NZDT
  workflow_call:
    inputs:
      images:
        description: 'JSON list of image names to scan, without the ghcr.io/totara/docker-dev- prefix'
        type: string
        required: true
      tag:
        description: 'Image tag to scan. Defaults to the version in version.txt'
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  ALL_IMAGES: '["mssql2017", "mssql2019", "mssql2022", "php-legacy", "php82", "php83", "php84", "php85"]'

jobs:
  prepare-db:
    name: Download Trivy vulnerability database
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.targets.outputs.images }}
      tag: ${{ steps.targets.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - name: Work out the images and tag
        id: targets
        env:
          IMAGES: ${{ inputs.images }}
          TAG: ${{ inputs.tag }}
        run: |
          # On master version.txt is the newest release, which is what :latest points at. On a build run
          # it is the version that build just published, so a prebuild is scanned before the release.
          if [[ -z "$IMAGES" ]]; then
            IMAGES="$ALL_IMAGES"
          fi
          if [[ -z "$TAG" ]]; then
            TAG=$(tr -d '[:space:]' < version.txt)
          fi
          # Both values end up in a shell command, so only accept the characters an image name or tag can have
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and test("^[a-z0-9]+(-[a-z0-9]+)*$"))' <<< "$IMAGES" > /dev/null; then
            echo "::error::images must be a JSON list of lowercase alphanumeric names with single hyphens, got: $IMAGES"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::tag is not a valid image tag: $TAG"
            exit 1
          fi
          echo "Images: $IMAGES, tag: $TAG"
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Set up Trivy
        uses: ./.github/actions/setup-trivy
      - name: Download vulnerability database
        run: trivy image --download-db-only

  scan-image:
    name: Scan ${{ matrix.image }} image for vulnerabilities
    needs: prepare-db
    runs-on: ubuntu-latest
    strategy:
      # One image failing to pull should not drop the results for the others
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare-db.outputs.images) }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - name: Set up Trivy
        uses: ./.github/actions/setup-trivy
      - name: Run Trivy vulnerability scanner
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ needs.prepare-db.outputs.tag }}
        # Findings with no Debian fix are not actionable here, matching the repo scan. The policy drops
        # the kernel headers package, see the comment in the policy.
        run: >-
          trivy image
          --skip-db-update
          --ignore-unfixed
          --ignore-policy .github/trivy/ignore.rego
          --severity CRITICAL,HIGH
          --format sarif
          --output "trivy-results-$IMAGE-image.sarif"
          "ghcr.io/totara/docker-dev-$IMAGE:$TAG"
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results-${{ matrix.image }}-image.sarif
          # One category per image whichever workflow ran the scan, so alerts are tracked in one place
          category: trivy-image-${{ matrix.image }}
