name: Create Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create or update the release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # The RELEASE_TOKEN repository secret must be a personal access token with contents
          # and pull-requests write access. The default GITHUB_TOKEN is not sufficient: events
          # it creates do not start new workflow runs, so the release pull request would skip
          # the required checks and the release tag would not trigger the image builds.
          token: ${{ secrets.RELEASE_TOKEN }}
          target-branch: master
