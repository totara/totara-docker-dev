name: Build PHP images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - php/**
      - '!php/includes/**'
      - .github/workflows/build-image.yml
      - .github/workflows/build-php.yml

# Publishing runs are queued rather than run side by side, so a build ahead of the release and the
# release itself can't push the same image at once. A new push to a pull request cancels its stale build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-php-images:
    name: Build PHP images
    uses: ./.github/workflows/build-image.yml
    strategy:
      fail-fast: false
      matrix:
        version: [82, 83, 84, 85]
    with:
      image: php${{ matrix.version }}
      context: ./php
      dockerfile: php${{ matrix.version }}/Dockerfile
    secrets: inherit

  # PHP 7.2 to 8.1 are end of life and share one image built on a current Debian with deb.sury.org packages
  build-php-legacy-image:
    name: Build PHP legacy image
    uses: ./.github/workflows/build-image.yml
    with:
      image: php-legacy
      context: ./php
      dockerfile: php-legacy/Dockerfile
    secrets: inherit

  scan-php-images:
    name: Scan PHP images
    needs: [build-php-images, build-php-legacy-image]
    # Pull request builds publish nothing, so there is nothing new to scan
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/scan-images.yml
    with:
      images: '["php-legacy", "php82", "php83", "php84", "php85"]'
