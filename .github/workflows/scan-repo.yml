name: Trivy Repo Vulnerability Scan

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # The misconfiguration checks are fetched at run time, so a weekly run can find checks that did
  # not exist when master was last pushed
  schedule:
    - cron: '0 18 * * 0' # Run every Monday at 6am NZST / 7am NZDT

permissions:
  contents: read

jobs:
  scan-repo:
    name: Scan repo for vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - name: Set up Trivy
        uses: ./.github/actions/setup-trivy
      - name: Run Trivy vulnerability scanner
        run: >-
          trivy fs .
          --scanners vuln,secret,misconfig
          --ignorefile .trivyignore.yaml
          --ignore-unfixed
          --severity CRITICAL,HIGH
          --format sarif
          --output trivy-results-repo.sarif
          --exit-code 1
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        with:
          sarif_file: 'trivy-results-repo.sarif'
