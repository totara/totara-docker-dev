on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      context:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: 'Dockerfile'
      multiarch:
        required: false
        type: boolean
        default: true

# The build mode comes from the calling workflow's event:
# * pull_request - build only, nothing is pushed
# * workflow_dispatch on a branch - push :X.Y.Z from version.txt ahead of the release, but not :latest,
#   so users on the current release don't pick up the new image early. Fails if vX.Y.Z is already tagged.
# * push of tag vX.Y.Z, or workflow_dispatch on that tag - push :X.Y.Z, and :latest if vX.Y.Z is the
#   newest tag. Rebuilding an older tag never moves :latest.
# When publishing, the build is skipped if :X.Y.Z already exists and was built from the same context
# and workflows, so building ahead of the release means the release only has to move :latest.
#
# Each platform builds on its own native runner, as arm64 under QEMU is slow and segfaults at random.
# When publishing, each platform is pushed by digest, and the merge job tags the multi-arch image.

env:
  IMAGE: ghcr.io/totara/docker-dev-${{ inputs.image }}
  KEY_LABEL: com.totara.docker-dev.build-key

jobs:
  prepare:
    name: Prepare ${{ inputs.image }} build
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.mode.outputs.version }}
      latest: ${{ steps.mode.outputs.latest }}
      platforms: ${{ steps.platforms.outputs.platforms }}
      key: ${{ steps.check.outputs.key }}
      up-to-date: ${{ steps.check.outputs.up-to-date }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - name: Work out the build mode and version
        id: mode
        run: |
          version=$(tr -d '[:space:]' < version.txt)
          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            tag_exists=true
          fi
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              mode='pr'
              ;;
            push|workflow_dispatch)
              if [[ "$GITHUB_REF" == "refs/tags/v$version" ]]; then
                mode='release'
              elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match version.txt ($version)"
                exit 1
              elif [[ "$tag_exists" == "true" ]]; then
                echo "::error::v$version is already released, run this on the release pull request branch instead"
                exit 1
              else
                mode='prebuild'
              fi
              ;;
            *)
              echo "::error::Unsupported event $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac
          latest=false
          if [[ "$mode" == "release" ]]; then
            newest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' | sort -V | tail -n 1)
            if [[ "$newest" == "v$version" ]]; then
              latest=true
            else
              echo "::notice::v$version is not the newest tag ($newest), so :latest will not be moved"
            fi
          fi
          echo "Mode: $mode, version: $version, move latest: $latest"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: Work out the platforms
        id: platforms
        env:
          MULTIARCH: ${{ inputs.multiarch }}
        run: |
          # Each platform builds on a native runner, the build matrix and the merge job both read this list
          platforms=$(jq -nc --argjson multiarch "$MULTIARCH" '[
              {platform: "linux/amd64", arch: "amd64", runner: "ubuntu-24.04"},
              {platform: "linux/arm64", arch: "arm64", runner: "ubuntu-24.04-arm"}
            ] | if $multiarch then . else map(select(.arch == "amd64")) end')
          echo "Platforms: $platforms"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: ${{ steps.mode.outputs.mode != 'pr' }}
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for an up to date image
        id: check
        if: ${{ steps.mode.outputs.mode != 'pr' }}
        env:
          CONTEXT: ${{ inputs.context }}
          VERSION: ${{ steps.mode.outputs.version }}
          PLATFORMS: ${{ steps.platforms.outputs.platforms }}
        run: |
          # The workflows are part of the key, so changes to the build options or the callers' inputs rebuild too
          key=$(git rev-parse "HEAD:$CONTEXT" "HEAD:.github/workflows" | sha1sum | cut -d' ' -f1)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          existing=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Image}}' 2> /dev/null) || existing='{}'
          # A single platform image comes back as the image itself, a multi-arch one as a map of platform to image.
          # Every platform has to carry the key, so an image missing a platform is rebuilt.
          # An arm64 image can be listed with its v8 variant, which is dropped to match the platform list.
          if jq -e --arg label "$KEY_LABEL" --arg key "$key" --argjson platforms "$PLATFORMS" '
              (if has("config") then {(.os + "/" + .architecture): .} else . end)
              | with_entries(.key |= sub("^linux/arm64/v8$"; "linux/arm64")) as $images
              | all($platforms[].platform; $images[.].config.Labels[$label] == $key)' <<< "$existing" > /dev/null; then
            echo "$IMAGE:$VERSION is already built with key $key, skipping the build"
            echo "up-to-date=true" >> "$GITHUB_OUTPUT"
          else
            echo "$IMAGE:$VERSION is not built with key $key for every platform, building"
            echo "up-to-date=false" >> "$GITHUB_OUTPUT"
          fi

  # Skipped when the image is up to date. A skipped job shows its name expressions unexpanded.
  build:
    name: Build ${{ inputs.image }} image (${{ matrix.platform }})
    needs: prepare
    if: ${{ needs.prepare.outputs.up-to-date != 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # A publish stops at the first failed platform, a pull request builds them all
      fail-fast: ${{ needs.prepare.outputs.mode != 'pr' }}
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    env:
      MODE: ${{ needs.prepare.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - name: Log in to GitHub Container Registry
        if: ${{ env.MODE != 'pr' }}
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract labels for Docker
        if: ${{ env.MODE != 'pr' }}
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.IMAGE }}
          # Only used for the version label, the tags are set by the merge job
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
          labels: |
            ${{ env.KEY_LABEL }}=${{ needs.prepare.outputs.key }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ env.MODE != 'pr' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}
      - name: Export the digest
        if: ${{ env.MODE != 'pr' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ inputs.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          if [[ -z "$DIGEST" ]]; then
            echo "::error::The build did not output a digest"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$NAME-$ARCH"
      - name: Upload the digest
        if: ${{ env.MODE != 'pr' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ inputs.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ inputs.image }}-${{ matrix.arch }}
          if-no-files-found: error
          # Long enough to re-run the merge job on its own the next day
          retention-days: 7
          # A rerun of the workflow uploads the same artifact name again
          overwrite: true

  # Skipped on pull requests, so the name has no expressions. The caller's job name shows the image.
  merge:
    name: Tag image
    needs: [prepare, build]
    # Tags a new build, or moves :latest to an up to date image, in which case the build is skipped
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success'
        && contains(fromJSON('["success", "skipped"]'), needs.build.result)
        && needs.prepare.outputs.mode != 'pr'
        && (needs.prepare.outputs.up-to-date != 'true' || needs.prepare.outputs.latest == 'true') }}
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      UP_TO_DATE: ${{ needs.prepare.outputs.up-to-date }}
    steps:
      - name: Download the digests
        if: ${{ env.UP_TO_DATE != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # The pattern can match other images with this prefix, the next step only reads the expected files
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.image }}-*
          merge-multiple: true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the image from the platform digests
        if: ${{ env.UP_TO_DATE != 'true' }}
        env:
          NAME: ${{ inputs.image }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          tags=(--tag "$IMAGE:$VERSION")
          if [[ "$LATEST" == "true" ]]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          sources=()
          for arch in $(jq -r '.[].arch' <<< "$PLATFORMS"); do
            file="$RUNNER_TEMP/digests/$NAME-$arch"
            if [[ ! -f "$file" ]]; then
              echo "::error::No digest for $arch, its artifact is missing or expired, so re-run all jobs"
              exit 1
            fi
            sources+=("$IMAGE@$(< "$file")")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Point latest at the existing image
        if: ${{ env.UP_TO_DATE == 'true' }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
