# Legacy containers - these are no longer built or maintained
services:
  php-7.2:
    image: ghcr.io/totara/docker-dev-php72
    container_name: totara_php72
    restart: ${RESTART_POLICY:-no}
    working_dir: ${REMOTE_SRC}
    environment:
      CONTAINERNAME: php-7.2
      TZ: ${TIME_ZONE}
      HIST_FILE: /root/.bash_history
      DISABLE_AUTO_UPDATE: "true" # disables oh-my-zsh update message
      USE_ZSH_NERDFONT: ${USE_ZSH_NERDFONT:-0}
    volumes:
      - ${LOCAL_SRC}:${REMOTE_SRC}
      - totara-data:${REMOTE_DATA}
      - ./php/includes:/var/www/totara/includes
      - bash-history:/root/.bash_history
      - zsh-history:/root/.zsh_history
      - ./shell:/root/custom_shell
    depends_on:
      - php-7.2-debug
    networks:
      - totara

  php-7.2-debug:
    image: ghcr.io/totara/docker-dev-php72-debug
    container_name: totara_php72_debug
    restart: ${RESTART_POLICY:-no}
    working_dir: ${REMOTE_SRC}
    environment:
      CONTAINERNAME: php-7.2-debug
      TZ: ${TIME_ZONE}
      XDEBUG_CONFIG: client_host=${HOST_IP}
      XDEBUG_SESSION: totara72
      PHP_IDE_CONFIG: serverName=totara72
      HIST_FILE: /root/.bash_history
      DISABLE_AUTO_UPDATE: "true" # disables oh-my-zsh update message
      USE_ZSH_NERDFONT: ${USE_ZSH_NERDFONT:-0}
    volumes:
      - ${LOCAL_SRC}:${REMOTE_SRC}
      - totara-data:${REMOTE_DATA}
      - ./php/includes:/var/www/totara/includes
      - bash-history:/root/.bash_history
      - zsh-history:/root/.zsh_history
      - ./shell:/root/custom_shell
    networks:
      - totara

  php-7.2-cron:
    image: ghcr.io/totara/docker-dev-php72-cron
    container_name: totara_php72_cron
    restart: ${RESTART_POLICY:-no}
    environment:
      TZ: ${TIME_ZONE}
    volumes:
      - ${LOCAL_SRC}:${REMOTE_SRC}
      - totara-data:${REMOTE_DATA}
      - ./php/includes:/var/www/totara/includes
      - ./cron.d:/etc/cron.d
    networks:
      - totara

  # Do not add new PHP versions here, add them to compose/php.yml instead!

volumes:
  totara-data:
  bash-history:
  zsh-history:
