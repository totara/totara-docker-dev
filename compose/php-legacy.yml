# End of life PHP versions. The official php images for these are frozen on Debian releases that no
# longer get security updates, so they are all built here from one image on a current Debian with the
# deb.sury.org packages, see php/php-legacy/Dockerfile. PHP_VERSION picks the version for each container.
# Supported PHP versions live in compose/php.yml.
services:
  php-7.2:
    image: ghcr.io/totara/docker-dev-php-legacy
    container_name: totara_php72
    restart: ${RESTART_POLICY:-no}
    working_dir: ${REMOTE_SRC}
    environment:
      PHP_VERSION: "7.2"
      CONTAINERNAME: php-7.2
      CRON_CONTAINER: ${CRON_CONTAINER:-none}
      TZ: ${TIME_ZONE}
      HIST_FILE: /root/.bash_history
      DISABLE_AUTO_UPDATE: "true" # disables oh-my-zsh update message
      USE_ZSH_NERDFONT: ${USE_ZSH_NERDFONT:-0}
    volumes:
      - ${LOCAL_SRC}:${REMOTE_SRC}
      - totara-data:${REMOTE_DATA}
      - ./cron.d:/etc/cron.d
      - ./php/includes:/var/www/totara/includes
      - coverage-report:/var/www/totara/coverage-report
      - bash-history:/root/.bash_history
      - zsh-history:/root/.zsh_history
      - ./shell:/root/custom_shell
    depends_on:
      - php-7.2-debug
    networks:
      - totara

  php-7.2-debug:
    image: ghcr.io/totara/docker-dev-php-legacy
    container_name: totara_php72_debug
    restart: ${RESTART_POLICY:-no}
    working_dir: ${REMOTE_SRC}
    environment:
      PHP_VERSION: "7.2"
      CONTAINERNAME: php-7.2-debug
      CRON_CONTAINER: ${CRON_CONTAINER:-none}
      TZ: ${TIME_ZONE}
      XDEBUG_CONFIG: client_host=${HOST_IP}
      XDEBUG_MODE: debug
      XDEBUG_SESSION: totara72
      PHP_IDE_CONFIG: serverName=totara72
      HIST_FILE: /root/.bash_history
      DISABLE_AUTO_UPDATE: "true" # disables oh-my-zsh update message
      USE_ZSH_NERDFONT: ${USE_ZSH_NERDFONT:-0}
    volumes:
      - ${LOCAL_SRC}:${REMOTE_SRC}
      - totara-data:${REMOTE_DATA}
      - ./cron.d:/etc/cron.d
      - ./php/includes:/var/www/totara/includes
      - coverage-report:/var/www/totara/coverage-report
      - bash-history:/root/.bash_history
      - zsh-history:/root/.zsh_history
      - ./shell:/root/custom_shell
    networks:
      - totara

